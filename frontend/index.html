<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--Phse 0-->
  <main class="main-conatainer">
    <div class=" col-md-8 offset-2 mt-2">
      <select id="chooseTask" class="form-select">
        <option disabled selected>Choose One</option>
        <option id="task1" value="task1">Task 1</option>
        <option id="task2" value="task2">Task 2</option>
        <option id="task3" value="task3">Task 3</option>
      </select>
    </div>
    <div class="row">
      <div id="spinnerContainer" class="col-md-12 d-flex justify-content-center align-items-center d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    </div>
    <div id="task3Choise" class="row m-2" hidden >
      <div class="col-md-6 d-flex justify-content-center flex-column">
        <button id="loadStdBtn" class="btn btn-outline-success btn-custom-width">Load all Students</button>
      </div>

       <div class="col-md-6 d-flex justify-content-end flex-column">
        <label >Enter student Id</label>
        <input id="stdIdInput" type="number" class="form-control" placeholder="e.g 5">
      </div>
    </div>
    <div id="container-class" class=" m-2 border-1 row">
   


</div>
       
   


    </div>

  </main>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
