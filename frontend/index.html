<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body id="index-body">
    <header>
      <nav class="nav navbar-expand-md p-2">
    
      </nav>

    </header>
    <!--Phse 0-->
    <main class="main-conatainer">

      <div class="row">
        <div id="spinnerContainer"
          class="col-md-12 d-flex justify-content-center align-items-center d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>

        </div>
     
        <div id="expense-tracker-container" class="expense-tracker row m-2"
          >
          <div class="row info-cards  ">
            <div class="col-md-4 mt-2">
              <div
                class=" pb-5 pt-4   card d-flex flex-column flex-wrap align-content-center p-3">
                <span class="text-center">Total</span>
                <h3 id="totalAmounts" class="text-center">0</h3>
              </div>
            </div>

            <div class="col-md-4 mt-2">
              <div
                class="card pt-4   pb-5 d-flex flex-column flex-wrap align-content-center p-3">
                <span class="text-center">Number of expenses</span>
                <h3 id="numberOfExpense" class="text-center">0</h3>
              </div>
            </div>
            <div class="col-md-4 mt-2 ">
              <div
                class="card pt-4 pb-4 d-flex flex-column flex-wrap align-content-center p-3">
                <span class="text-center">Highest expense</span>
                <h3 id="highestNumber" class="text-center">0</h3>
                <span id="highestName"
                  class="text-center small">NA</span>
              </div>
            </div>
          </div>
          <div class="search card m-3 pb-3">
            <h5>Sort By:</h5>
            <div class="row">
              <div class="col-md-4">
                <label class="form-label">Title:</label>
                <select id="titleSort" class="form-select sort-selection">
                  <option disabled selected value>Choose one</option>
                  <option value="asc">Ascending (A → Z) </option>
                  <option value="desc">Descending (Z → A) </option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Date:</label>
               <select id="dateSort" class="form-select sort-selection">
                  <option disabled selected value>Choose one</option>
                  <option value="asc">Ascending ↑ </option>
                  <option value="desc">Descending ↓ </option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Category:</label>
                <select id="categorySort" class="form-select category-selection">
                  <option disabled selected value>Choose one</option>
                  <option value="all">All</option>

                </select>
              </div>
            </div>
          </div>
          <div class="Add-Card card m-3 p-3">
            <h5>Add New Expense</h5>
            <form id="addNewExpense">
              <div class="row mt-2">

                <div class="col-md-3">
                  <label class="form-label">Title :</label>
                  <input name="title" type="text" class="form-control form-ele "
                    placeholder="enter title here">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Amount :</label>
                  <input name="amount" type="number" class="form-control form-ele "
                    placeholder="enter the amount here ">
                </div>
                <div class="col-md-3">
                  <label class="form-label">date :</label>
                  <input min="2020-01-01" max="2027-12-31" name="date" type="date" class="form-control form-ele ">
                </div>

                <div class="col-md-3">
                  <label class="form-label">category :</label>
                  <select name="category" class="form-select category-selection form-ele ">
                    <option disabled selected value>Choose one</option>
                  </select>
                </div>

              </div>

              <div class="row d-flex justify-content-end mt-3">
                <div class="col-md-4 d-flex justify-content-end">
                  <button type="submit" class="btn btn-outline-primary"> <i
                      class="fa-solid fa-plus"></i> Add New Button</button>
                </div>
              </div>
            </form>
          </div>

          <div class="card m-3">

            <div class="row">
              <div class="col-md-12">
                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">#</th>
                      <th scope="col">Title</th>
                      <th scope="col">Amount</th>
                      <th scope="col">Category</th>
                      <th scope="col">Date</th>
                      <th scope="col">Action</th>
                    </tr>
                  </thead>
                  <tbody id="expense-tbody">

                  </tbody>
                </table>
              </div>
            </div>

          </div>

        </div>
        <div id="container-class" class="row m-2">

        </div>

      </div>

    </main>
    <div id="modal-area">
      
    </div>

    <div class="modal fade" id="editModal" tabindex="-1"
      aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Edit
              expense</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6">
                <label class="form-label">Title :</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Amount :</label>
                <input type="number" class="form-control">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <label class="form-label">Date :</label>
                <input type="date" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Category :</label>
                <select class="form-select category-selection ">
                  <option disabled selected value>Choose one</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
              data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1"
      aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-white ">
            <h1 class="modal-title text-danger fs-5"
              id="exampleModalLabel">Delete Expense</h1>
            <button type="button" class="btn-close  " data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <h6>Are you sure you want to delete this expense ?</h6>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
              data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-outline-danger">Save
              changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

    <script
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
